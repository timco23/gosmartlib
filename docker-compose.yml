services:
  traefik:
    image: traefik:v3.6.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker.network=traefik"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

  frontend:
    build: ./frontend/my-app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.195.201.32.74.traefik.me`)"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.frontend.entrypoints=web"
    depends_on:
      - backend
    networks:
      - frontend
      - traefik

  backend:
    build: ./backend/spring-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.backend.rule=Host(`api.195.201.32.74.traefik.me`)"
      - "traefik.http.routers.backend.entrypoints=web"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - traefik

  database:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${sqlrootpwd}
      - MYSQL_DATABASE=helloworlddb
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${sqlrootpwd}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    volumes:
      - databasedata:/var/lib/mysql
      - ./sqlinit:/docker-entrypoint-initdb.d

networks:
  backend:
  frontend:
  traefik:
    name: traefik

volumes:
  databasedata:
