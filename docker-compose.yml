version: "3.5"
services:
  traefik:
    image: traefik:v3.6.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

  frontend:
    build: ./frontend/my-app
    volumes:
      - "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    depends_on:
      - backend
    networks:
      - frontend
      - traefik

  backend:
    build: ./backend/spring-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

      - "traefik.http.routers.backend.middlewares=backend-stripprefix"
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - traefik

  database:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${sqlrootpwd}
      - MYSQL_DATABASE=helloworlddb
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${sqlrootpwd}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    volumes:
      - databasedata:/var/lib/mysql
      - ./sqlinit:/docker-entrypoint-initdb.d

networks:
  backend:
  frontend:
  traefik:
    name: traefik

volumes:
  databasedata: