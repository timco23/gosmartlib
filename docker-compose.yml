services:
  traefik:
    image: traefik:v3.6.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

  frontend:
    build: ./frontend/my-app
    volumes:
      - "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    depends_on:
      - backend
    networks:
      - frontend
      - traefik

  backend:
    build: ./backend/spring-backend
    restart: on-failure
    environment:
      - MYSQL_ROOT_PASSWORD=${sqlrootpwd}
      - SMARTSCHOOL_CLIENT_ID=${SMARTSCHOOL_CLIENT_ID}
      - SMARTSCHOOL_CLIENT_SECRET=${SMARTSCHOOL_CLIENT_SECRET}
      - SMARTSCHOOL_PLATFORM=${SMARTSCHOOL_PLATFORM}
      - SMARTSCHOOL_REDIRECT_URI=${SMARTSCHOOL_REDIRECT_URI}
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.middlewares=cors,backend-stripprefix"

      - "traefik.http.routers.backend-oauth.rule=PathPrefix(`/oauth`)"
      - "traefik.http.routers.backend-oauth.priority=20"
      - "traefik.http.routers.backend-oauth.entrypoints=web"
      - "traefik.http.routers.backend-oauth.service=backend"
      - "traefik.http.routers.backend-oauth.middlewares=cors"

      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=http://localhost,http://gsmartlib.tech,http://www.gsmartlib.tech,http://api.gsmartlib.tech,http://app.195.201.32.74.traefik.me"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

    depends_on:
      database:
        condition: service_healthy
        restart: true
    networks:
      - frontend
      - backend
      - traefik

  database:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${sqlrootpwd}
      - MYSQL_DATABASE=LibraryDB
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${sqlrootpwd}",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - backend
    volumes:
      - databasedata:/var/lib/mysql
      - ./sqlinit:/docker-entrypoint-initdb.d

networks:
  backend:
  frontend:
  traefik:
    name: traefik

volumes:
  databasedata:
