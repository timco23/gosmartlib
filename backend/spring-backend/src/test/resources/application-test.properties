spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

smartschool.client-id=test
smartschool.client-secret=test
smartschool.platform=test
smartschool.redirect-uri=http://localhost/callback
app.frontend-base-url=http://localhost:4200
oauth.default-school-id=1
app.jwt.secret=test-secret-test-secret-test-secret
app.jwt.expires-minutes=60

ENCRYPTION_SECRET=test-encryption-secret-for-unit-tests

# OneRoster OAuth
spring.security.oauth2.client.registration.oneroster.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.oneroster.client-id=test
spring.security.oauth2.client.registration.oneroster.client-secret=test
spring.security.oauth2.client.registration.oneroster.scope=roster-core.readonly
spring.security.oauth2.client.provider.oneroster.token-uri=https://test/ims/oneroster/token