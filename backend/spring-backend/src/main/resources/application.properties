spring.application.name=spring-backend
spring.datasource.url=jdbc:mysql://database:3306/LibraryDB
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Security logging 
logging.level.org.springframework.security=DEBUG
logging.level.edu.ap.spring_backend=DEBUG

# Smartschool OAuth
smartschool.client-id=${SMARTSCHOOL_CLIENT_ID}
smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}
smartschool.platform=${SMARTSCHOOL_PLATFORM}
smartschool.redirect-uri=${SMARTSCHOOL_REDIRECT_URI}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
oauth.default-school-id=${OAUTH_DEFAULT_SCHOOL_ID:0}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES}

# Zorg dat de backend proxy headers vertrouwt (Traefik)
server.forward-headers-strategy=framework

