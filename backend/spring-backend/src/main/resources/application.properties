spring.config.import=optional:file:../../.env[.properties]

spring.application.name=spring-backend
spring.datasource.url=jdbc:mysql://database:3306/LibraryDB
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Security logging 
logging.level.root=INFO
logging.level.edu.ap.spring_backend=INFO
logging.level.org.springframework.security=WARN

# Smartschool OAuth
smartschool.client-id=${SMARTSCHOOL_CLIENT_ID}
smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}
smartschool.platform=${SMARTSCHOOL_PLATFORM}
smartschool.redirect-uri=${SMARTSCHOOL_REDIRECT_URI}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
oauth.default-school-id=${OAUTH_DEFAULT_SCHOOL_ID:0}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES}

# Make sure the backend trusts the proxy headers (Traefik)
server.forward-headers-strategy=framework

# Multilingual moderation API (EN/NL/FR/AR)
moderation.api.url=${MODERATION_API_URL:https://api-inference.huggingface.co/models/unitary/multilingual-toxic-xlm-roberta}
moderation.api.key=${MODERATION_API_KEY:}

#If toxicity ≥ 0.85 → reject (Otherwise allow it)
moderation.toxic-threshold=${MODERATION_TOXIC_THRESHOLD:0.85} 

server.error.include-message=always

# Book metadata providers
book.metadata.google.enabled=true
book.metadata.google.api-key=${GOOGLE_BOOKS_API_KEY:}
book.metadata.openlibrary.enabled=true
book.metadata.hardcover.enabled=true
book.metadata.hardcover.api-key=${HARDCOVER_API_KEY:}