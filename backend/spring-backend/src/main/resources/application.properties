spring.mandatory-file-encoding=UTF-8
spring.config.import=optional:file:../../.env[.properties]

spring.application.name=spring-backend
spring.datasource.url=jdbc:mysql://database:3306/LibraryDB
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Security logging 
logging.level.root=DEBUG
logging.level.edu.ap.spring_backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Smartschool OAuth
smartschool.client-id=${SMARTSCHOOL_CLIENT_ID}  
smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}
smartschool.platform=${SMARTSCHOOL_PLATFORM}
smartschool.redirect-uri=${SMARTSCHOOL_REDIRECT_URI}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES}

# Make sure the backend trusts the proxy headers (Traefik)
server.forward-headers-strategy=framework

# Mistral Moderation API (EN/FR/DE/ES/AR gratis)
moderation.api.key=${MODERATION_API_KEY:}

#Local fallback (always block this words + also use the api)
moderation.blocklist=fuck,fuk,fck,fucking,fucked,fucker,fukking,fcking,pussy,cunt,dick,cock,asshole,arsehole,bastard,bitch,whore,slut,twat,wanker,prick,tit,tits,boobs,nigger,faggot,fag,crap,shit,bullshit,motherfucker,kak,kut,lul,hoer,neuken,pijpen,aftrekken,tering,kanker,godverdomme,godver,verdomme,klootzak,trut,teef,schijt,flikker,nicht,homo,kkr,zkere,mongool,neger,putain,merde,connard,salope,encule,pute,baise,niquer,puta,joder,mierda,cabron,chatte,\u0643\u0633,\u0637\u064A\u0632,\u0634\u0631\u0645\u0648\u0637\u0629,\u0639\u0627\u0647\u0631\u0629,\u0632\u0628,\u0643\u0644\u0628,\u062D\u0645\u0627\u0631,\u0644\u0639\u0646\u0629,\u0645\u0646\u064A\u0648\u0643,\u062E\u0648\u0644,\u064A\u0644\u0639\u0646,\u0627\u0644\u0644\u0639\u0646\u0629,\u062F\u064A\u0643

server.error.include-message=always

# Book metadata providers
book.metadata.google.enabled=true
book.metadata.google.api-key=${GOOGLE_BOOKS_API_KEY:}
book.metadata.openlibrary.enabled=true
book.metadata.hardcover.enabled=true
book.metadata.hardcover.api-key=${HARDCOVER_API_KEY:}

# Encryption
app.encryption.secret=${ENCRYPTION_SECRET}

# OneRoster OAuth
spring.security.oauth2.client.registration.oneroster.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.oneroster.client-id=${ONEROSTER_CLIENT_ID}
spring.security.oauth2.client.registration.oneroster.client-secret=${ONEROSTER_CLIENT_SECRET}
spring.security.oauth2.client.registration.oneroster.scope=roster-core.readonly
spring.security.oauth2.client.provider.oneroster.token-uri=https://${SMARTSCHOOL_PLATFORM}/ims/oneroster/token