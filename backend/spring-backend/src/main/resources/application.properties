spring.config.import=optional:file:../../.env[.properties]

spring.application.name=spring-backend
spring.datasource.url=jdbc:mysql://database:3306/LibraryDB
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Security logging 
logging.level.root=INFO
logging.level.edu.ap.spring_backend=INFO
logging.level.org.springframework.security=WARN

# Smartschool OAuth
smartschool.client-id=${SMARTSCHOOL_CLIENT_ID}
smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}
smartschool.platform=${SMARTSCHOOL_PLATFORM}
smartschool.redirect-uri=${SMARTSCHOOL_REDIRECT_URI}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
oauth.default-school-id=${OAUTH_DEFAULT_SCHOOL_ID:0}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES}

# Make sure the backend trusts the proxy headers (Traefik)
server.forward-headers-strategy=framework

# Mistral Moderation API (EN/FR/DE/ES/AR gratis)
moderation.api.key=${MODERATION_API_KEY:}

#Local fallback (always block this words + also use the api)
moderation.blocklist=fuck,fuk,fck,fucking,fucked,fucker,fukking,fcking,pussy,cunt,dick,cock,asshole,arsehole,bastard,bitch,whore,slut,twat,wanker,prick,tit,tits,boobs,nigger,faggot,fag,crap,shit,bullshit,motherfucker,poop,caca,ass,butt,kak,kut,lul,hoer,neuken,pijpen,aftrekken,tering,kanker,godverdomme,godver,verdomme,klootzak,trut,teef,schijt,flikker,nicht,homo,kkr,zkere,mongool,debiel,autist,neger,putain,merde,connard,salope,encule,enculé,pute,bite,couille,baise,niquer,puta,coño,joder,mierda,cabron,hostia,chatte,enfoiré,اللعنة,ديك,اللعنة

server.error.include-message=always

# Book metadata providers
book.metadata.google.enabled=true
book.metadata.google.api-key=${GOOGLE_BOOKS_API_KEY:}
book.metadata.openlibrary.enabled=true
book.metadata.hardcover.enabled=true
book.metadata.hardcover.api-key=${HARDCOVER_API_KEY:}