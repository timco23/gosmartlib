<div class="no-school-container">
  <img class="no-school-bg" src="bookshelf.jpg" alt="" />
  <div class="no-school-card">
    <img src="logo_go_antwerpen.svg" alt="GO! Antwerpen" class="logo" />
    
    <div class="warning-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>

    <h1>Toegang Geweigerd</h1>
    <p class="warning-text">
      Je hebt momenteel geen toegang tot GO!SmartLib omdat er geen school is gekoppeld aan jouw account.
    </p>
    <p class="instruction-text">
      Neem contact op met de beheerder van je school of probeer opnieuw in te loggen.
    </p>

    <button class="btn-logout" (click)="logoutAndRedirectToLogin()">
      Terug naar login
    </button>
    
    <p class="no-school-tagline">GO!SmartLib - AP Hogeschool</p>
  </div>
</div>
