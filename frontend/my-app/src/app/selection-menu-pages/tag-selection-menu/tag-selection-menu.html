<div class="filter-row">
  <input [(ngModel)]="filterInput" placeholder="Zoeken op tagnaam..." />
</div>

<div class="tag-count">{{ selectedTagCount }} tag(s) geselecteerd</div>

<ul class="tag-list">
  @for (tag of filteredTags; track tag.id) {
    @if((tag.name == "Pedagogisch" && authService.atLeastHasRole(role.LEERKRACHT)) || tag.name != "Pedagogisch") {
      <li class="tag-item">
      <label>
        <input type="checkbox" [ngModel]="isTagSelected(tag)" (ngModelChange)="toggleTag(tag)" />
        <span>{{ tag.name }}</span>
        @if (tag.default) {
          <span class="badge-default">Standaard</span>
        }
      </label>
    </li>  
    }
  } @empty {
    <li>Geen tags gevonden.</li>
  }
</ul>
