<div class="filter-row">
  <input [(ngModel)]="filterInput" placeholder="Zoeken op subgenrenaam..." />
</div>

<div class="subgenre-count">{{ selectedSubgenreCount }} subgenre(s) geselecteerd</div>

<ul class="subgenre-list">
  @for (subgenre of filteredSubgenres; track subgenre.id) {
    @if((subgenre.name == "Pedagogisch" && authService.atLeastHasRole(role.LEERKRACHT)) || subgenre.name != "Pedagogisch") {
      <li class="subgenre-item">
      <label>
        <input type="checkbox" [ngModel]="isSubgenreSelected(subgenre)" (ngModelChange)="toggleSubgenre(subgenre)" />
        <span>{{ subgenre.name }}</span>
      </label>
    </li>  
    }
  } @empty {
    <li class="subgenre-item">Geen subgenres gevonden.</li>
  }
</ul>
