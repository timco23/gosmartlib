<div class="filter-row">
  <input [(ngModel)]="filterInput" placeholder="Zoeken op categorienaam..." />
</div>
<div class="category-count">{{ selectedCategoryCount }} categorie(ën) geselecteerd</div>
<ul class="category-list">
  @for (category of filteredCategories; track category.id) {
    <li class="category-item">
      <label>
        <input type="checkbox" [ngModel]="isCategorySelected(category)" (ngModelChange)="toggleCategory(category)" />
        <span>{{ category.name }}</span>
      </label>
    </li>
  } @empty {
    <li class="category-item">Geen categorieën gevonden.</li>
  }
</ul>
