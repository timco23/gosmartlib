<h1>Tag Management</h1>

<div class="add-row">
  <input
    [ngModel]="newTagName()"
    (ngModelChange)="newTagName.set($event)"
    placeholder="New tag..."
  />
  <button (click)="addTag()">Add</button>
</div>
@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

<ul>
  @for (tag of tags(); track tag.id) {
    <li>
      @if (editingId() === tag.id) {
        <input [ngModel]="editName()" (ngModelChange)="editName.set($event)" />
        <button (click)="saveEdit(tag.id)">Save</button>
      } @else {
        <span>{{ tag.name }}</span>
        @if (!tag.default) {
          <button (click)="startEdit(tag)">Edit</button>
        }
      }
      @if (!tag.default) {
        <button (click)="deleteTag(tag.id)">Delete</button>
      }
    </li>
  } @empty {
    <li>Geen tags gevonden.</li>
  }
</ul>
