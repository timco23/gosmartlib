<h1>Tag Beheer</h1>

<!-- Mockup book selection -->
<div class="book-select">
  <label>Boek:</label>
  <select
    [ngModel]="selectedBookId()"
    (ngModelChange)="selectedBookId.set($event ? +$event : null)"
  >
    <option [ngValue]="null">-- Selecteer een boek --</option>
    @for (book of books(); track book.id) {
      <option [ngValue]="book.id">{{ book.title }}</option>
    }
  </select>
</div>

<!-- Input fields -->
<div class="add-row">
  <input
    [ngModel]="filterInput()"
    (ngModelChange)="filterInput.set($event)"
    placeholder="Zoeken op naam"
  />
  <input
    [ngModel]="newTagName()"
    (ngModelChange)="newTagName.set($event)"
    placeholder="Nieuwe tag..."
  />
  <button (click)="addTag()">Toevoegen</button>
</div>
@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

<!-- Display and edit tags -->
<ul>
  @for (tag of filteredTags(); track tag.id) {
    <li>
      <!-- checkbox for the selected book -->
      @if (selectedBook()) {
        <input
          type="checkbox"
          [ngModel]="isTagSelected(tag.id)"
          (ngModelChange)="toggleTag(tag.id)"
        />
      }
      @if (editingId() === tag.id) {
        <input [ngModel]="editName()" (ngModelChange)="editName.set($event)" />
        <button (click)="saveEdit(tag.id)">Opslaan</button>
        <button (click)="cancelEdit()">Annuleren</button>
      } @else {
        <span>{{ tag.name }}</span>
        @if (!tag.default) {
          <button (click)="startEdit(tag)">Wijzigen</button>
        }
      }
      @if (!tag.default) {
        <button (click)="deleteTag(tag.id)">Verwijderen</button>
      }
    </li>
  } @empty {
    <li>Geen tags gevonden.</li>
  }
</ul>
