@if (shown()) {
    <div class="overlay">
        <div class="content">
            <button class="close-btn" (click)="closePopup()">&times;</button>
            <h2 class="popup-title">Boek selecteren</h2>
            
            <div class="form-group">
                <label for="book-select">Selecteer een boek:</label>
                <select id="book-select" [(ngModel)]="dropdownValue" (change)="changeItemId()">
                    <option value="0">Kies een boek...</option>
                    @for (book of books | async; track $index) {
                        <option [value]="book.id">{{ book.title }}</option>
                    }
                </select>
            </div>

            <div class="popup-actions">
                <button class="primary-btn" (click)="selectBook()">Toevoegen</button>
            </div>

            @if(invalidChoiceError) {
                <p class="error">Selecteer een geldig boek.</p>
            }
        </div>
    </div>
}
