@if (currentUser) {
  <div class="navbar">
    <div class="nav-logo">
      <a routerLink="/home">
        <img src="logo_go_antwerpen.svg" alt="GO! Antwerpen" />
      </a>
    </div>

    <div class="nav-links">
      @if (authService.atLeastHasRole(role.ADMIN)) {
        <a routerLink="/schools" class="nav-link" routerLinkActive="active">Schoolbeheer</a>
      }
      <a routerLink="/books" class="nav-link">Boeken</a>
      <a routerLink="/favorites" class="nav-link">Favoriete boeken</a>
      @if (authService.atLeastHasRole(role.ADMIN)) {
        <a routerLink="/lendings" class="nav-link" routerLinkActive="active">Uitleenbeheer</a>
      }
    </div>

    <div class="user-menu">
      <div class="user-info" (click)="toggleDropdown()">
        <strong>{{ currentUser?.name }}</strong> ({{ currentUser?.role }})
        <span class="dropdown-arrow" [class.open]="dropdownOpen">▼</span>
      </div>

      @if (dropdownOpen) {
        <div class="dropdown-menu">
          <a routerLink="/profile" (click)="closeDropdown()" class="dropdown-item">
            Mijn gegevens
          </a>
          <button (click)="logout()" class="dropdown-item btn-logout">Uitloggen</button>
        </div>
      }
    </div>
  </div>
}

<router-outlet></router-outlet>
