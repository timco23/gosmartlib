<div class="print-page-container">
  <div class="controls no-print">
    <button type="button" (click)="back()">Terug</button>
    <div class="selection-controls">
      <button type="button" (click)="toggleAll(true)">Selecteer alles</button>
      <button type="button" (click)="toggleAll(false)">Deselecteer alles</button>
    </div>
    <button type="button" class="print-btn" (click)="print()" [disabled]="selectedItems.length === 0">
      Afdrukken ({{ selectedItems.length }})
    </button>
  </div>

  @if (loading) {
    <p class="no-print">Laden...</p>
  } @else if (items.length === 0) {
    <p class="no-print">Geen exemplaren gevonden.</p>
  } @else {
    <div class="copy-list no-print">
      @for (item of items; track item.copy.id) {
        <label class="copy-row">
          <input type="checkbox" [(ngModel)]="item.selected" />
          <span>{{ item.copy.barcode }} — {{ item.copy.condition }} — {{ item.copy.copy_status }}</span>
        </label>
      }
    </div>

    <div class="barcode-labels">
      @for (item of selectedItems; track item.copy.id) {
        <div class="barcode-label">
          @if (item.imageUrl) {
            <img [src]="item.imageUrl" [alt]="item.copy.barcode" />
          }
          <p class="barcode-text">{{ item.copy.barcode }}</p>
        </div>
      }
    </div>
  }
</div>
