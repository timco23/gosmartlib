<div class="review-form">
  <div class="review-form-header">
    <h3>Review schrijven</h3>
    <button class="close-btn" type="button" (click)="cancel()">✕</button>
  </div>

  <div class="stars">
    <app-star-display [score]="stars" [interactive]="true" [size]="28" (scoreChange)="stars = $event" />
  </div>

  <textarea
    placeholder="Beschrijving (optioneel)"
    [(ngModel)]="description"
    name="description"
    rows="5"
  ></textarea>

  <div class="anonymous-checkbox">
    <input type="checkbox" id="anonymous" [(ngModel)]="isAnonymous" name="isAnonymous" />
    <label for="anonymous">Anoniem plaatsen</label>
  </div>

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }

  <button
    type="button"
    class="submit-btn"
    [disabled]="stars === 0 || isSubmitting"
    (click)="submit()"
  >
    Review publiceren
  </button>
</div>
