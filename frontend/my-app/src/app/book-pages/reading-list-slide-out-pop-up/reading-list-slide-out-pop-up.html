@if(readingListQueue().length > 0) {
    @if(showPopUp()) {
    <app-pop-up [title]="'Boek al in leeslijst'" [message]="'Kan boek niet aan leeslijst toevoegen omdat deze zich al in de leeslijst bevindt.'" [actions]="popUpActions" (actionClicked)="closePopUp()"></app-pop-up>
    }

<body class="popup-container" animate.enter="sliding">
    <div class="handle">
        <div class="queue-count">{{readingListQueue().length}}</div>
        <p class="popup-header">Leeslijst</p>
    </div>
    
    <main class="content-wrapper">
        <div class="inner-container">
            @for (book of readingListQueue(); track $index) {
                <div class="book-card">
                    <div class="delete-button" (click)="removeBookFromQueue(book)">×</div>
                    <img class="book-cover" [src]="api.getBookCoverUrl(book.id)" alt="Cover">
                    <p class="book-title">{{book.title}}</p>
                </div>
            }
        </div>
        <div class="action-buttons">
            <button class="clear-button" (click)="clearQueue()">Leegmaken</button>
            <button class="create-list-button" (click)="makeReadingListWithBooks()">Lijst maken</button>
        </div>
    </main>
</body>
}
