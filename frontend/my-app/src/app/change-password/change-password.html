<div class="change-password-container">
  <h2>Wachtwoord wijzigen</h2>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <label>Oud wachtwoord</label>
    <input type="password" placeholder="Oud wachtwoord" formControlName="oldPassword" />

    <label>Nieuw wachtwoord</label>
    <input
      type="password"
      placeholder="Nieuw wachtwoord (min. 8 karakters)"
      formControlName="newPassword"
    />

    <label>Bevestig nieuw wachtwoord</label>
    <input
      type="password"
      placeholder="Bevestig nieuw wachtwoord"
      formControlName="confirmPassword"
    />

    <div class="button-row">
      <button type="button" class="cancel-button" (click)="cancel()">Annuleren</button>
      <button type="submit" [disabled]="loading || passwordForm.invalid">
        {{ loading ? 'Wijzigen...' : 'Wijzigen' }}
      </button>
    </div>
  </form>
</div>
