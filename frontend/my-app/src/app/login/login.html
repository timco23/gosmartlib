<div class="login-container">
  <img class="login-bg" src="bookshelf.jpg" alt="" />
  <div class="login-card">
    <img src="logo_go_antwerpen.svg" alt="GO! Antwerpen" />
    <button class="btn-smartschool" (click)="loginWithSmartschool()">
      <span class="btn-smartschool__logo">
        <img src="s_logo_12x18.svg" alt="Smartschool" />
      </span>
      <span class="btn-smartschool__divider"></span>
      <span class="btn-smartschool__text">Aanmelden met Smartschool</span>
    </button>
    <p class="login-tagline">GO!SmartLib</p>

    <div class="admin-login-section">
      <button class="btn-admin-toggle" (click)="showAdminForm = !showAdminForm">
        <span class="btn-admin-toggle__text">Aanmelden als administrator</span>
        <span class="toggle-arrow" [class.open]="showAdminForm">▾</span>
      </button>

      @if (showAdminForm) {
        <div class="admin-form">
          @if (adminLoginError) {
            <p class="admin-error">{{ adminLoginError }}</p>
          }
          <label for="admin-email">E-mailadres</label>
          <input
            id="admin-email"
            type="email"
            [(ngModel)]="adminEmail"
            placeholder="admin@school.be"
            (keyup.enter)="loginWithCredentials()"
          />
          <label for="admin-password">Wachtwoord</label>
          <input
            id="admin-password"
            type="password"
            [(ngModel)]="adminPassword"
            placeholder="Wachtwoord"
            (keyup.enter)="loginWithCredentials()"
          />
          <button
            class="btn-admin-login"
            (click)="loginWithCredentials()"
            [disabled]="adminLoginLoading"
          >
            {{ adminLoginLoading ? 'Aanmelden...' : 'Aanmelden' }}
          </button>
        </div>
      }
    </div>
  </div>
</div>
