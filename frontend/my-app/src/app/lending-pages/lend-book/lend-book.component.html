<body class="lend-book-container">
  <header class="lend-book-header">
    <a class="back-link" [routerLink]="['/lendings']">← Terug naar uitleningen</a>
    <div class="header-actions">
      <h2>Boek uitlenen</h2>
    </div>
  </header>

  <div class="lending-card">
    <form action="lending">
        <div class="form-group">
            <label for="book">Boek</label>
            <input type="text" id="book" name="book" placeholder="ISBN" required />
        </div>
    
        <div class="form-group">
            <label for="borrower">Uitgeleend aan</label>
            <input type="text" id="borrower" name="borrower" placeholder="Naam van de lener" required />
        </div>
    
        <button type="submit" class="add-button">Boek uitlenen</button>
    </form>
  </div>
</body>
