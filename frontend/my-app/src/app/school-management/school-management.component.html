<div class="school-list">
  <div *ngIf="!addingSchool && !editingSchool">
    <h2>Scholen</h2>
    <button (click)="addingSchool = true">School toevoegen</button>
    <ul *ngIf="schools">
      <li *ngFor="let school of schools" class="SchoolItem" style="cursor:pointer">
        {{ school.name }}
        <button class="EditButton" (click)="selectSchool(school)">School bewerken</button>
      </li>
    </ul>
  </div>

  <div *ngIf="addingSchool || editingSchool">
    <h2>{{ editingSchool ? 'School bewerken' : 'School toevoegen' }}</h2>
    <form [formGroup]="schoolForm" (ngSubmit)="onSubmit()">
      <label>Naam</label>
      <input placeholder="Naam" formControlName="name">
      <label>Adres</label>
      <input placeholder="Adres" formControlName="address">
      <label>Uitleenperiode (dagen)</label>
      <input type="number" min="0" formControlName="lendingPeriodDays">
      <label>Verlengperiode (dagen)</label>
      <input type="number" min="0" formControlName="extendPeriodDays">
      <label>Maximum aantal verlengingen</label>
      <input type="number" min="0" formControlName="maxExtends">
      <label>Maximum aantal uitleningen per leerling</label>
      <input type="number" min="0" formControlName="maxLendsStudent">
      <label>Maximum aantal uitleningen per leerkracht</label>
      <input type="number" min="0" formControlName="maxLendTeacher">
      <label>Herinnering lener (dagen voor inleverdatum)</label>
      <input type="number" min="0" formControlName="lenderNotificationPeriod">
      <label>Te-laat melding lener (dagen na inleverdatum)</label>
      <input type="number" min="0" formControlName="lenderLateNotificationPeriod">
      <label>Melding voor bibliotheekbeheerder bij niet terugbrengen (dagen na inleverdatum)</label>
      <input type="number" min="0" formControlName="librarianNotificationNotReturned">
      <label>
        <input type="checkbox" formControlName="librarianRequestNotification">
        Melding voor bibliotheekbeheerder bij verzoek
      </label>
      <label>
        <input type="checkbox" formControlName="externalVisibility">
        Collectie zichtbaar voor externen
      </label>
      <label>
        <input type="checkbox" formControlName="externalLending">
        Uitlenen aan externen toegestaan
      </label>
      <label>
        <input type="checkbox" formControlName="reviews">
        Recensies inschakelen
      </label>
      <label>
        <input type="checkbox" formControlName="reviewModeration">
        Recensies modereren
      </label>
      <div class="button-row">
        <button type="button" class="cancel-button" (click)="cancelForm()">Annuleren</button>
        <button type="submit">Opslaan</button>
      </div>
      <button type="button" class="DeleteButton" style="width:100%; margin-top: 8px;" (click)="confirmDelete()">School verwijderen</button>
    </form>
  </div>

  <div *ngIf="showDeleteConfirm" class="overlay">
    <div class="confirm-dialog">
      <p>Bent u zeker dat u <strong>{{ editingSchool?.name }}</strong> wil verwijderen?</p>
      <div class="button-row">
        <button type="button" class="cancel-button" (click)="showDeleteConfirm = false">Annuleren</button>
        <button type="button" class="confirm-delete-btn" (click)="confirmDeleteSchool()">Verwijderen</button>
      </div>
    </div>
  </div>
</div>
