<ul class="level-list">
  @for (level of readingLevels; track level.name) {
    <li class="level-item">
      <label>
        <input type="radio" [checked]="isSelected(level)" (change)="toggleLevel(level)" />
        <span>{{ level.name }}</span>
      </label>
      <div class="tooltip-anchor">
        <span class="info-icon">i</span>
        <div class="tooltip-box">{{ level.description }}</div>
      </div>
    </li>
  } @empty {
    <li class="level-item">Geen niveaus gevonden.</li>
  }
</ul>
