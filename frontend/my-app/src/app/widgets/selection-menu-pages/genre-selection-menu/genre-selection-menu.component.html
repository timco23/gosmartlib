<div class="filter-row">
  <input [(ngModel)]="filterInput" placeholder="Zoeken op genrenaam..." />
</div>

<div class="genre-count">{{ selectedGenreCount }} genre(s) geselecteerd</div>

<ul class="genre-list">
  @for (genre of visibleGenres; track genre.id) {
    @if((genre.name == "Pedagogisch" && authService.atLeastHasRole(role.LEERKRACHT)) || genre.name != "Pedagogisch") {
      <li class="genre-item">
      <label>
        <input type="checkbox" [ngModel]="isGenreSelected(genre)" (ngModelChange)="toggleGenre(genre)" />
        <span>{{ genre.name }}</span>
      </label>
    </li>  
    }
  } @empty {
    <li>Geen genres gevonden.</li>
  }
</ul>
