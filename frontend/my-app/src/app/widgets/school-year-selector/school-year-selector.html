@if (availableYears.length > 0) {
  <div class="year-selector">
    @for (year of availableYears; track year; let i = $index) {
      <button class="year-btn" [class.year-btn--active]="isYearActive(year, i)"
              (click)="selectYear(year)">{{ year }}</button>
    }
    <button class="year-btn" [class.year-btn--active]="selectedYear === 'all'"
            (click)="selectYear('all')">Totaal</button>
  </div>
}
