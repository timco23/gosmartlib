@if (score > 0 || interactive) {
  <span class="star-display" [class.interactive]="interactive">
    @for (star of stars; track $index) {
      <svg
        class="star"
        viewBox="0 0 24 24"
        [style.width.px]="size"
        [style.height.px]="size"
        (mouseenter)="onMouseEnter($index)"
        (mouseleave)="onMouseLeave()"
        (click)="onClick($index)"
      >
        <defs>
          <clipPath [id]="'star-fill-' + instanceId + '-' + $index">
            <rect x="0" y="0" [attr.width]="star.fill * 24" height="24" />
          </clipPath>
        </defs>
        <path
          d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          fill="#d4d4d4"
        />
        <path
          d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          fill="#f5a623"
          [attr.clip-path]="'url(#star-fill-' + instanceId + '-' + $index + ')'"
        />
      </svg>
    }
  </span>
} @else {
  <span class="no-reviews">Geen reviews</span>
}
