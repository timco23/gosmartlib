version: "3.5"
services:
  traefik:
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      
  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`gsmartlib.tech`) || Host(`www.gsmartlib.tech`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
      
  backend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.gsmartlib.tech`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.backend.middlewares=cors"
    networks:
    - frontend
    - backend
    - traefik
      
  database:
    volumes:
      - "/opt/docker-data/mysql:/var/lib/mysql"
      - ./sqlinit:/docker-entrypoint-initdb.d